
name: Build SSPlayer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'SSPlayer-Android-Base.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP do SSPlayer não encontrado"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

          GRADLE_FILE=$(find project -name settings.gradle.kts -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "settings.gradle.kts não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PROJECT_DIR/app/build.gradle.kts"

          echo "Projeto preparado em: $PROJECT_DIR"
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Compilar APK
        run: |
          GRADLE_FILE=$(find project -name settings.gradle.kts -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SSPlayer-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
